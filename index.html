<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Liste de courses</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="receipt" id="receipt">

  <header class="receipt__head">
    <p class="receipt__eyebrow">Famille — liste partagée</p>
    <h1 class="receipt__title">À ACHETER</h1>
    <p class="receipt__sub" id="itemCount">0 article</p>
  </header>

  <div class="tear tear--top" aria-hidden="true"></div>

  <main class="list" id="list" aria-live="polite">
    <!-- items injected here -->
  </main>

  <p class="empty" id="emptyState">La liste est vide. Ajoutez ce qu'il manque ci-dessous.</p>

  <div class="tear tear--bottom" aria-hidden="true"></div>

  <footer class="receipt__foot">
    <p class="stamp" id="statusStamp">connexion…</p>
  </footer>

</div>

<form class="addbar" id="addForm" autocomplete="off">
  <input
    type="text"
    id="itemInput"
    class="addbar__input"
    placeholder="Ajouter un article…"
    maxlength="60"
    required
  >
  <input
    type="text"
    id="nameInput"
    class="addbar__name"
    placeholder="Toi"
    maxlength="16"
  >
  <button type="submit" class="addbar__btn" aria-label="Ajouter">+</button>
</form>

<script type="module" src="app.js"></script>
</body>
</html>
